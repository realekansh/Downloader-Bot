services:
  bot:
    build: .
    restart: unless-stopped
    env_file: bot/.env
    environment:
      - DATABASE_URL=postgresql://bot:bot_password@postgres:5432/downloader_bot
      - REDIS_HOST=redis
      - DOWNLOAD_PATH=/app/downloads
      - DEV_MODE=false
    volumes:
      - downloads:/app/downloads
      - db_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python workers/download_worker.py
    env_file: bot/.env
    environment:
      - DATABASE_URL=postgresql://bot:bot_password@postgres:5432/downloader_bot
      - REDIS_HOST=redis
      - DOWNLOAD_PATH=/app/downloads
      - DEV_MODE=false
    volumes:
      - downloads:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot_password
      POSTGRES_DB: downloader_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d downloader_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  downloads:
  db_data:
